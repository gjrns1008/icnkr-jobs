name: Collect icnkr jobs
on:
  schedule:
    - cron: '0 11 * * *'     # 매일 20:00 KST (UTC 11:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Collect new postings and rebuild index.html
        run: python collect.py --days 2
      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json index.html
          if git diff --cached --quiet; then echo "no change"; else
            n=$(git diff --cached --numstat data.json | awk '{print $1}')
            git commit -m "Update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'): data.json +${n:-0} lines"
            git push
          fi
      - name: Telegram notice (completion only)
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py "icnkr 구인공고 페이지 업데이트 완료"
